# Proprietes du projet Gradle.
#
# Ce fichier manquait : sans android.useAndroidX, la construction echoue
# avec « Configuration :app:debugRuntimeClasspath contains AndroidX
# dependencies, but the android.useAndroidX property is not enabled »,
# alors que les deux seules dependances du projet — appcompat et webkit —
# sont precisement des bibliotheques AndroidX.

# Les dependances du projet sont des artefacts AndroidX.
android.useAndroidX=true

# Aucune bibliotheque de support historique n'est utilisee : rien a
# reecrire, et desactiver cette reecriture accelere la construction.
android.enableJetifier=false

# Chaque module a sa propre classe R, sans heriter de celles de ses
# dependances. C'est le defaut depuis AGP 8 ; explicite ici pour que le
# comportement ne depende pas de la version de l'outil.
android.nonTransitiveRClass=true

# Memoire du demon Gradle. La valeur par defaut suffit rarement des que
# le plugin Android et Kotlin sont charges ensemble.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

kotlin.code.style=official
